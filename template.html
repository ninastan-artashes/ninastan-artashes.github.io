<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>章のタイトル | 現代東アルメニア語文法</title>

    <style>

        body {
            margin: 0;
            margin: 0;

            background: linear-gradient(
                135deg,
                #421019,
                #7a2933,
                #9a3b42,
                #5b1721,
                #3d0e16
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 50px 100px;
            background: #fffdf8;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            padding: 20px 0 55px;
            border-bottom: 1px solid #aaa;
        }

        .book-title {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            color: #555;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: normal;
            color: #18283b;
            margin: 0;
        }

        .armenian-title {
            margin-top: 12px;
            font-size: 1.2rem;
        }

        main {
            max-width: 720px;
            margin: 55px auto;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: normal;
            color: #18283b;
            margin-top: 60px;
            padding-bottom: 10px;
            border-bottom: 1px solid #aaa;
        }

        h3 {
            font-size: 1.35rem;
            font-weight: normal;
            color: #18283b;
            margin-top: 45px;
        }

        p {
            margin-bottom: 1.7em;
            text-align: justify;
        }

        /* アルメニア語 */

        .armenian {
            font-size: 1.08em;
        }

        /* 例文 */

        .example {
            margin: 25px 0;
            padding: 18px 25px;
            border-left: 3px solid #18283b;
            background: #f4f2ec;
        }

        /* 表 */

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            font-weight: normal;
            background: #f0eee8;
        }

        /* ページ移動 */

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 80px;
            padding-top: 25px;
            border-top: 1px solid #aaa;
        }

        .navigation a {
            color: #18283b;
            text-decoration: none;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #777;
        }

        /* スマートフォン */

        @media (max-width: 650px) {

            .page {
                padding: 40px 25px 70px;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                text-align: left;
            }

            table {
                font-size: 0.9rem;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- ==================== -->
    <!-- ヘッダー -->
    <!-- ==================== -->

    <header>

        <div class="book-title">
            MODERN EASTERN ARMENIAN GRAMMAR
        </div>

        <h1>
            章のタイトル
        </h1>

        <div class="armenian-title">
            Հայերեն վերնագիր
        </div>

    </header>


    <!-- ==================== -->
    <!-- 本文 -->
    <!-- ==================== -->

    <main>


        <h2>節のタイトル</h2>

        <p>
            ここに本文を書きます。
        </p>

        <p>
            ここにも本文を書きます。
        </p>


        <h3>小見出し</h3>

        <p>
            ここに本文を書きます。
        </p>


        <!-- 例文 -->

        <div class="example">

            <div class="armenian">
                Հայերեն նախադասություն։
            </div>

            <div>
                日本語訳。
            </div>

        </div>


        <!-- 表 -->

        <table>

            <tr>
                <th>項目</th>
                <th>内容</th>
            </tr>

            <tr>
                <td>例</td>
                <td>内容</td>
            </tr>

            <tr>
                <td>例</td>
                <td>内容</td>
            </tr>

        </table>


    </main>


    <!-- ==================== -->
    <!-- ページ移動 -->
    <!-- ==================== -->

    <div class="navigation">

        <a href="index.html">
            ← 目次
        </a>

        <a href="next.html">
            次の章 →
        </a>

    </div>


    <!-- ==================== -->
    <!-- フッター -->
    <!-- ==================== -->

    <footer>

        現代東アルメニア語文法<br>
        Ժամանակակից Արևելահայերենի Քերականություն

    </footer>


</div>

</body>

</html>
