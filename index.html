            font-weight: normal;
            color: #18283b;

        }

        }

        .chapter-number {

            font-size: 0.82rem;

        /* ---------- Mobile ---------- */

                padding: 45px 25px 70px;
            }

                padding: 45px 10px 60px;
            }

            h1 {
                font-size: 2.1rem;
            }

            .armenian-title {
                font-size: 1.25rem;
            }

            .series {
                font-size: 0.7rem;
                letter-spacing: 0.15em;
            }

        }

        /* ---------- Oxford-style red flowing lines ---------- */

.flowing-lines {
    position: relative;
    height: 75px;
    margin: -25px 0 35px;
    overflow: hidden;
}

.flowing-lines::before,
.flowing-lines::after {
    content: "";
    position: absolute;
    left: -5%;
    width: 110%;
    height: 45px;
    border-top: 3px solid #9e1b23;
    border-radius: 50%;
    transform: rotate(-2deg);
}

.flowing-lines::before {
    top: 5px;
}

.flowing-lines::after {
    top: 25px;
    left: 10%;
    width: 95%;
    border-top-width: 1.5px;
    opacity: 0.65;
}
