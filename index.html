        }

        }

        p {

        }

        .contents {

        }

        .contents-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            border-bottom: 1px dotted #bbb;
        }

        .contents-item a {
            color: #20242a;
            text-decoration: none;
        }

        .contents-item a:hover {
            color: #18283b;
            text-decoration: underline;
        }

        .chapter-number {
            display: inline-block;
            width: 45px;
            color: #666;
        }


        /* ---------- Footer ---------- */

        footer {
            margin-top: 100px;
            padding-top: 25px;
            border-top: 1px solid #aaa;
            text-align: center;
            font-size: 0.82rem;
            color: #777;
        }


        /* ---------- Mobile ---------- */

        @media (max-width: 650px) {

            .page {
                padding: 45px 25px 70px;
            }

            .title-page {
                padding: 45px 10px 60px;
            }

            h1 {
                font-size: 2.1rem;
            }

            .armenian-title {
                font-size: 1.25rem;
            }

            .series {
                font-size: 0.7rem;
                letter-spacing: 0.15em;
            }

        }

/* =========================================
   COVER DESIGN
   ========================================= */

.title-page {
    position: relative;
    overflow: hidden;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
}

/* Large decorative red shape */
.title-page::before {
    content: "";
    position: absolute;

    width: 620px;
    height: 620px;

    top: -390px;
    right: -260px;

    background:
        linear-gradient(
            135deg,
            #43070c 0%,
            #7d0b16 28%,
            #b71929 55%,
            #690914 82%,
            #39050a 100%
        );

    border-radius: 50%;

    transform: rotate(-18deg);

    box-shadow:
        0 20px 45px rgba(60, 0, 0, 0.25);

    z-index: 0;
}


/* Second red shape */
.title-page::after {
    content: "";

    position: absolute;

    width: 520px;
    height: 520px;

    bottom: -360px;
    left: -230px;

    background:
        linear-gradient(
            135deg,
            #39050a 0%,
            #790b15 30%,
            #b51c2b 60%,
            #650914 100%
        );

    border-radius: 50%;

    transform: rotate(20deg);

    box-shadow:
        0 -15px 40px rgba(60, 0, 0, 0.20);

    z-index: 0;
}


/* Make title text appear above decoration */

.title-page > * {
    position: relative;
    z-index: 2;
}


/* Small decorative line */

.title-page .rule {
    width: 120px;
    border: 0;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            #43070c,
            #b71929,
            #43070c
        );

    margin: 40px auto;
}


/* Slightly stronger title */

.title-page h1 {
    text-shadow:
        0 1px 0 rgba(255,255,255,0.5);
}


/* Mobile */

@media (max-width: 650px) {

    .title-page {
        min-height: 570px;
    }

    .title-page::before {
        width: 430px;

        right: -210px;
    }

    .title-page::after {
        width: 380px;
        height: 380px;

        bottom: -270px;
        left: -190px;
    }

}
