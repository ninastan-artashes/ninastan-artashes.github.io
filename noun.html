<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>名詞 | 現代東アルメニア語文法</title>

    <style>

        body {
            margin: 0;
            background: #f8f6f0;
            color: #20242a;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.9;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 50px 100px;
            background: #fffdf8;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            padding: 20px 0 55px;
            border-bottom: 1px solid #aaa;
        }

        .book-title {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            color: #555;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: normal;
            color: #18283b;
            margin: 0;
        }

        .armenian {
            margin-top: 12px;
            font-size: 1.2rem;
        }

        main {
            max-width: 720px;
            margin: 55px auto;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: normal;
            color: #18283b;
            margin-top: 60px;
            padding-bottom: 10px;
            border-bottom: 1px solid #aaa;
        }

        h3 {
            font-size: 1.35rem;
            font-weight: normal;
            color: #18283b;
            margin-top: 45px;
        }

        p {
            margin-bottom: 1.7em;
            text-align: justify;
        }

        .armenian-text {
            font-size: 1.05em;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 80px;
            padding-top: 25px;
            border-top: 1px solid #aaa;
        }

        .navigation a {
            color: #18283b;
            text-decoration: none;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #777;
        }

        @media (max-width: 650px) {

            .page {
                padding: 40px 25px 70px;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                text-align: left;
            }

        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0 40px;
            font-size: 0.95rem;
        }

        th,
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
        }

        th {
            font-weight: normal;
            color: #18283b;
            background: #f1eee6;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
        }

        td {
            background: #fffdf8;
        }

        tr:last-child td {
            border-bottom: 1px solid #aaa;
        }

        /* 表の左端の項目名 */
        th:first-child {
            text-align: center;
        }

        /* 表の中のアルメニア文字 */
        td {
            font-family: Georgia, "Times New Roman", serif;
        }

        /* スマートフォン */
        @media (max-width: 650px) {

            table {
                font-size: 0.85rem;
            }

            th,
            td {
                padding: 8px 6px;
            }

        }

        /* ---------- Alphabet Table ---------- */

        .alphabet-table {
            width: 100%;
            margin: 35px 0 45px;
        }

        .alphabet-table th,
        .alphabet-table td {
            padding: 9px 14px;
        }

        .alphabet-table th {
            font-size: 0.9rem;
            letter-spacing: 0.03em;
        }

        .alphabet-table td:first-child {
            font-size: 1.15rem;
            font-weight: normal;
        }

        .alphabet-table td:nth-child(2) {
            font-family: "Times New Roman", Georgia, serif;
            font-style: italic;
        }

        .alphabet-table td:nth-child(4) {
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 650px) {

            .alphabet-table th,
            .alphabet-table td {
                padding: 8px 5px;
                font-size: 0.85rem;
            }

            .alphabet-table td:first-child {
                font-size: 1rem;
            }

        }
        
    </style>
</head>


<body>

<div class="page">

    <header>

        <div class="book-title">
            MODERN EASTERN ARMENIAN GRAMMAR
        </div>

        <h1>
            Ⅲ　名詞
        </h1>

        <div class="armenian">
             Գոյական
        </div>

    </header>


    <main>


        <h2>全体像</h2>

        <h2>発音</h2>

        


    </main>


    <div class="navigation">

        <a href="index.html">
            ← 目次
        </a>

        <a href="#">
            次の章 →
        </a>

    </div>


    <footer>

        現代東アルメニア語文法<br>
        Ժամանակակից Արևելահայերենի Քերականություն

    </footer>

</div>

</body>

</html>
